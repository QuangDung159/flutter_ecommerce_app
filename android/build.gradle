allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            if (!p.android.namespace) {
                def manifestFile = p.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def manifestContent = manifestFile.getText('UTF-8')
                    def matcher = manifestContent =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        p.android.namespace = matcher.group(1)
                    }
                }
            }
            p.android {
                compileSdkVersion 36
                buildFeatures {
                    buildConfig = true
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            p.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
