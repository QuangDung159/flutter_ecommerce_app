allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.configurations.all {
        resolutionStrategy {
            force 'com.google.mlkit:barcode-scanning:17.3.0'
            force 'com.google.mlkit:vision-common:17.3.0'
            force 'com.google.mlkit:common:18.11.0'
            force 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
        }
    }
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            if (!p.android.namespace) {
                def manifestFile = p.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def manifestContent = manifestFile.getText('UTF-8')
                    def matcher = manifestContent =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        p.android.namespace = matcher.group(1)
                    }
                }
            }
            p.android {
                compileSdkVersion 36
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                        }
                        ndkBuild {
                            arguments "APP_LDFLAGS+=-Wl,-z,max-page-size=16384"
                        }
                    }
                }
                buildFeatures {
                    buildConfig = true
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            p.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
